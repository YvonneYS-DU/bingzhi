<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <h1>AI Chat</h1>
      </div>
      <div class="controls">
        <label class="toggle">
          <span>AI 后端</span>
          <select id="backendSelect">
            <option value="">跟随服务端</option>
            <option value="openai">OpenAI 直连</option>
            <option value="langchain">LangChain</option>
          </select>
        </label>
        <label class="toggle">
          <span>流式</span>
          <input type="checkbox" id="streamToggle" checked>
        </label>
      </div>
    </header>

    <main class="chat-area" id="chatArea">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">AI</div>
        <h2>基础前后端模板</h2>
        <p>
          后端默认 <code>AI_BACKEND=openai</code>，直连 OpenAI 兼容 API。<br>
          可通过环境变量或前端切换为 LangChain 模式。
        </p>
        <div class="quick-prompts">
          <button data-prompt="你好，介绍一下你自己">你好，介绍一下你自己</button>
          <button data-prompt="用 Python 写一个快速排序">用 Python 写一个快速排序</button>
          <button data-prompt="解释一下什么是 RESTful API">解释一下什么是 RESTful API</button>
        </div>
      </div>
    </main>

    <footer class="composer">
      <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="sendBtn" title="发送">↑</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
